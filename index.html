<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Progress</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="login" class="screen"><div class="card auth"><p class="eyebrow">MY PROGRESS</p><h1>Your private progress tracker.</h1><p>Log in to access your check-ins.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Log in</button><p id="loginError"></p></form></div></div><div id="app" hidden><header><div><p class="eyebrow">MY PROGRESS</p><h2 id="title">Today's Check-in</h2></div><button id="logout" class="ghost">Log out</button></header><nav><button class="tab active" data-page="today">Today</button><button class="tab" data-page="progress">Progress</button></nav><main><section id="today"><form id="checkin"><div class="grid"><div class="card"><h3>⚖️ Weight</h3><label>Weight (kg)<input id="weight" type="number" step="0.1"></label></div><div class="card"><h3>🍽️ Food</h3><label>Calories<input id="calories" type="number"></label><div class="row"><label>Protein<input id="protein" type="number"></label><label>Carbs<input id="carbs" type="number"></label><label>Fat<input id="fat" type="number"></label></div><label>What I ate<textarea id="food"></textarea></label></div><div class="card"><h3>😊 How I feel</h3><label>Mood<select id="mood"><option value="">Choose...</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Rough</option></select></label><div class="row"><label>Energy<input id="energy" type="number" min="1" max="10"></label><label>Hunger<input id="hunger" type="number" min="1" max="10"></label></div></div><div class="card"><h3>📸 Progress photo</h3><input id="photo" type="file" accept="image/*"><small id="photoMsg">Optional · stored privately</small></div><div class="card wide"><h3>💭 Reflection</h3><textarea id="reflection" rows="5" placeholder="How did today feel?"></textarea></div></div><div class="actions"><button type="submit">Save today's check-in</button><span id="saveMsg"></span></div></form></section><section id="progress" hidden><div class="card"><h3>⚖️ Weight progress</h3><div id="stats"></div><canvas id="chart"></canvas></div><div class="card"><h3>📸 Recent photos</h3><div id="photos" class="photos"></div></div><div class="card"><h3>Recent check-ins</h3><div id="history"></div></div></section></main></div><script src="config.js"></script><script src="app.js"></script></body></html>
