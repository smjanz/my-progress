<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Progress</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h1>My Progress</h1>
      <p>Log in to your personal tracker.</p>

      <form id="login-form">
        <input id="email" type="email" placeholder="Email" autocomplete="email" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit">Log in</button>

        <p id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen" style="display:none;">

    <header class="topbar">
      <div>
        <small>MY PROGRESS</small>
        <h1>Today's Check-in</h1>
      </div>

      <button id="logout-button" type="button">Log out</button>
    </header>

    <main>

      <!-- TODAY -->
      <section class="tracker-card">

        <h2>⚖️ Weight</h2>

        <label>
          Weight (kg)
          <input id="weight" type="number" step="0.1" placeholder="e.g. 83.5">
        </label>

      </section>

      <section class="tracker-card">

        <h2>🍽️ What did I eat today?</h2>

        <label>
          Calories
          <input id="calories" type="number" placeholder="Optional">
        </label>

        <div class="three-columns">

          <label>
            Protein (g)
            <input id="protein" type="number">
          </label>

          <label>
            Carbs (g)
            <input id="carbs" type="number">
          </label>

          <label>
            Fat (g)
            <input id="fat" type="number">
          </label>

        </div>

        <label>
          Food / meals
          <textarea id="food" rows="5" placeholder="What did you eat today?"></textarea>
        </label>

      </section>

      <section class="tracker-card">

        <h2>😊 How am I feeling?</h2>

        <label>
          Mood
          <select id="mood">
            <option value="">Select...</option>
            <option>Great</option>
            <option>Good</option>
            <option>Okay</option>
            <option>Low</option>
            <option>Rough</option>
          </select>
        </label>

        <div class="two-columns">

          <label>
            Energy (1–10)
            <input id="energy" type="number" min="1" max="10">
          </label>

          <label>
            Hunger (1–10)
            <input id="hunger" type="number" min="1" max="10">
          </label>

        </div>

        <label>
          How did today feel?
          <textarea id="reflection" rows="4"></textarea>
        </label>

      </section>

      <section class="tracker-card">

        <h2>📸 Progress photo</h2>

        <input id="photo" type="file" accept="image/*">

        <p class="small">
          Your photo will be stored privately.
        </p>

      </section>

      <button id="save-checkin" type="button" onclick="alert('BUTTON WORKS')">
        Save today's check-in
      </button>

      <p id="save-status"></p>

      <!-- PROGRESS -->
      <section class="tracker-card">

        <h2>📈 My Progress</h2>

        <div id="progress-summary">
          <p>Start logging your check-ins and your progress will appear here.</p>
        </div>

      </section>

    </main>

  </div>

  <script src="login.js"></script>
  <script src="tracker.js"></script>

</body>
</html>
